<!doctype html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music Space</title>
<meta name="description" content="Campfire guitar: songs, practice games, a tuner and a lesson path. Works offline.">
<meta name="theme-color" id="themeColorMeta" content="#0f0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Music Space">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta property="og:title" content="Music Space">
<meta property="og:description" content="Campfire guitar: songs, practice games, a tuner and a lesson path. Works offline.">
<meta property="og:image" content="https://feirzen.github.io/music-space/icons/og-image.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="styles.css">
<script>
  /* paint the saved theme before anything shows, so there's no flash */
  try { const s = JSON.parse(localStorage.getItem("ms.state") || "{}"); if (s.theme) document.documentElement.dataset.theme = s.theme; } catch (e) {}
</script>
</head>
<body>
  <header class="top">
    <button id="backBtn" class="iconBtn" aria-label="Back" hidden>‹</button>
    <img src="icons/favicon.svg" class="logo" alt="">
    <h1 id="title">Music Space</h1>
    <span id="syncDot" class="syncDot" data-st="off"></span>
    <button id="gear" class="iconBtn" aria-label="Settings">⚙︎</button>
  </header>

  <main id="main"></main>

  <nav class="tabs">
    <button class="tab" data-tab="library"><span>🎵</span>Library</button>
    <button class="tab" data-tab="practice"><span>🎮</span>Practice</button>
    <button class="tab" data-tab="path"><span>🛤️</span>Path</button>
  </nav>

  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast"></div>

  <script src="theory.js"></script>
  <script src="data.js"></script>
  <script src="audio.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
