<!doctype html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music Space</title>
<meta name="description" content="Campfire guitar: songs, practice games, a tuner and a lesson path. Works offline.">
<meta name="theme-color" id="themeColorMeta" content="#0a1214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Music Space">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta property="og:title" content="Music Space">
<meta property="og:description" content="Campfire guitar: songs, practice games, a tuner and a lesson path. Works offline.">
<meta property="og:image" content="https://feirzen.github.io/music-space/icons/og-image.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script>
  try { const s = JSON.parse(localStorage.getItem("ms.state") || "{}"); if (s.theme) document.documentElement.dataset.theme = s.theme; } catch (e) {}
</script>
</head>
<body>
  <canvas id="ambient" aria-hidden="true"></canvas>
  <header class="top">
    <button id="backBtn" class="iconBtn" aria-label="Back" hidden></button>
    <img id="logo" src="icons/favicon.svg" class="logo" alt="">
    <h1 id="title">Music Space</h1>
    <div id="instSwitch" class="instSwitch" role="group" aria-label="Instrument"></div>
    <span id="syncDot" class="syncDot" data-st="off"></span>
    <button id="gear" class="iconBtn" aria-label="Settings"></button>
  </header>

  <main id="main"></main>

  <button id="timerPill" class="timerPill" hidden></button>

  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-tab="library" data-icon="notes"><span class="tabIcon"></span>Library</button>
    <button class="tab" data-tab="practice" data-icon="guitar"><span class="tabIcon"></span>Practice</button>
    <button class="tab" data-tab="path" data-icon="mountains"><span class="tabIcon"></span>Path</button>
  </nav>

  <div id="sheet" class="sheetWrap" hidden>
    <div id="sheetScrim" class="sheetScrim"></div>
    <div class="sheetPanel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheetHead"><span class="grabber"></span><h2 id="sheetTitle"></h2><button id="sheetClose" class="iconBtn" aria-label="Close"></button></div>
      <div id="sheetBody" class="sheetBody"></div>
    </div>
  </div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="theory.js"></script>
  <script src="audio.js"></script>
  <script src="data.js"></script>
  <script src="hints.js"></script>
  <script src="sync.js"></script>
  <script src="importer.js"></script>
  <script src="ambient.js"></script>
  <script src="core.js"></script>
  <script src="library.js"></script>
  <script src="practice.js"></script>
  <script src="path.js"></script>
  <script src="spotify.js"></script>
  <script src="takes.js"></script>
  <script src="voice.js"></script>
  <script src="app.js"></script>
<script src="https://feirzen.github.io/flag-hub/kit/kit.js" data-app="music-space" data-name="Music Space" data-look="off" data-gear="off" data-button="off" defer></script>
</body>
</html>
